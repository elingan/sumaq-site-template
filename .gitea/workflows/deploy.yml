# Publicación del sitio. Este fichero es IDÉNTICO en los ~100 repos www-*: no
# lleva el dominio ni la URL incrustados, así que la plantilla lo entrega tal
# cual y nadie tiene que retocarlo al crear un sitio.
#
# Va en .gitea/workflows/ y no en .github/workflows/ a propósito: el `origin` de
# la plantilla es GitHub, y allí este workflow intentaría ejecutarse en cada push
# contra un runner que no existe.
#
# Lo que cambia lo dicen once variables de Actions, y el nivel al que vive cada
# una no es un detalle: describe a qué pertenece el dato.
#
#   SITE_DEPLOY_TARGET   (organización) docroot (lab, Caddy) · sites (kallpa-server).
#                        Describe el entorno, así que es común a los ~100 repos.
#   SITES_HOST           (organización) dónde publicar: usuario@host del servidor
#                        que sirve los sitios, por el overlay. Va en la
#                        organización y NO incrustado aquí porque al conmutar
#                        entre punku-a y punku-b hay que cambiarlo en un sitio,
#                        no en ~100 repos.
#   SITES_PORT           (organización) puerto SSH del destino. Los servidores no
#                        escuchan en el 22.
#   SITE_SLUG            (repo) identificador del sitio en sumaq-app. Es la que
#                        habilita el workflow: sin ella no se construye nada (ver
#                        el `if:` del job). La escribe sumaq-app al enlazar el
#                        repo con el sitio, y en el lab la escribe seed.sh.
#   SITE_DOMAIN          (repo) dominio real del sitio. Lo escribe sumaq-app al
#                        fijar el dominio. Sin ella se deriva del slug (el último
#                        guion pasa a punto), que solo acierta con dominios de dos
#                        etiquetas.
#   SITE_URL             (repo) URL pública; alimenta `site:` en Astro y de ahí
#                        sitemap y canonical. También la escribe sumaq-app. Sin
#                        ella: en el lab cae a http://<slug>.preview.localhost:8080
#                        y en producción a https://<dominio>/, para que el sitemap
#                        apunte a donde el sitio se sirve de verdad y no a
#                        example.com.
#   SITE_LOCALE          (repo) idioma por defecto del sitio: el que se sirve SIN
#                        prefijo en la URL. Lo escribe sumaq-app al crear el sitio
#                        y no cambia después, porque sus datos viven en la raíz de
#                        content/. Sin ella se construye en alemán, que es el
#                        mercado.
#   SITE_LOCALES         (repo) los idiomas añadidos, separados por `;`. Cada uno
#                        se sirve bajo su prefijo (/en/) y lee sus datos de
#                        content/<idioma>/. La escribe sumaq-app y la inmensa
#                        mayoría de sitios NO la tiene: sin ella el sitio es
#                        monolingüe y se construye exactamente como siempre.
#   SITE_REDIRECTS       (repo) dominios comprados aparte que solo redirigen al
#                        canónico, en la forma `dominio=ruta` separados por `;`.
#                        La escribe sumaq-app, y la mayoría de sitios no la tiene.
#                        Sin ella el paso de redirecciones no se ejecuta.
#   SITE_ANALYTICS_KEY   (repo) la `public_key` que Ñahui asigna a ESTE sitio, y
#                        que viaja en el atributo `data-site` del <script>. No es
#                        un secreto: va en el HTML público de todas las páginas.
#                        La defensa de la ingesta es la comprobación de `Origin`
#                        contra el dominio dado de alta, el límite de tasa y la
#                        validación del payload, no esta clave.
#   SITE_ANALYTICS_ORIGIN (repo) origen del tracker de Ñahui:
#                        https://analytics.elingan.dev en producción,
#                        http://localhost:5188 contra una Ñahui de desarrollo.
#                        Describe el entorno, pero NO vive en la organización: va
#                        en el repo porque forma pareja con la clave y sumaq-app
#                        escribe las dos en la misma operación. Mientras estuvo
#                        arriba, una mitad la escribía la app por API y la otra
#                        una persona en la interfaz de Gitea, y la integridad
#                        dependía de que nadie olvidara la que no era suya.
#                        🔑 Sin LAS DOS no se emite ninguna etiqueta: la analítica
#                        es opt-in por pareja. Así el sitio de demostración no
#                        contamina las métricas de nadie, y un entorno a medio
#                        configurar no mide contra producción — el layout del kit
#                        ya no tiene origen por defecto.
#                        ⛔ Clave sin origen ABORTA el job (paso «Resolver slug…»).
#                        Publicar sin medir es un fallo mudo, y este es el único
#                        punto de la cadena que puede pararlo a tiempo.
#
# Las de repo tienen que ser de repo: identifican a un sitio concreto, y
# puestas en la organización le pondrían a los ~100 los datos del primero.
#
# Y un secreto de organización, `SITES_DEPLOY_KEY`: la clave SSH privada de
# despliegue. Nunca una credencial de administración — al otro lado está
# encerrada por `restrict` y `command="rrsync -wo /srv/sites"`, así que solo
# puede escribir ficheros de sitio dentro de ese directorio y nada más.
#
# Los dos runners responden a la misma label `sumaq-site`, porque no hay ninguna
# instancia donde ambos sean candidatos: un repo del Gitea local solo puede
# construir en el runner del lab, y uno de kallpa-server solo en el suyo.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    # Un repo sin SITE_SLUG todavía no es el sitio de nadie. Así nace: sumaq-app
    # lo genera desde la plantilla —lo que ya produce un push a main— y solo
    # después escribe las variables. Ese primer push no tiene dónde publicar, y
    # antes se resolvía derivando el slug del nombre del repo: un nombre elegido a
    # mano decidía el host del preview, y con renombrar el repo el sitio se movía
    # de sitio sin que sumaq-app se enterara.
    #
    # De ahí que el slug lo mande la app y solo la app. Mientras no lo haya, el
    # job entero se salta: la ejecución sale en verde sin pasos, que es lo honesto
    # —no había nada que publicar— y no deja un build huérfano en el docroot.
    if: vars.SITE_SLUG != ''
    runs-on: sumaq-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Habilitar pnpm
        run: corepack enable

      # El slug identifica al sitio y no cambia entre entornos: en producción se
      # sirve en <slug>.preview.sumaq.site y en el lab en <slug>.preview.localhost,
      # ambos en la raíz del host. Es el mismo valor que sumaq-app pone delante de
      # `.preview.` al enseñar el enlace en el CMS, así que tiene que venir de la
      # app —no derivarse aquí— o los dos dirían cosas distintas.
      #
      # El dominio real también lo manda sumaq-app en SITE_DOMAIN; sin ella se
      # deriva del slug (el último guion pasa a punto, elingan-dev → elingan.dev),
      # que solo acierta con dominios de dos etiquetas. De ahí que la variable gane.
      - name: Resolver slug, dominio y destino
        env:
          SLUG_VAR: ${{ vars.SITE_SLUG }}
          DOMAIN_VAR: ${{ vars.SITE_DOMAIN }}
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          TARGET_VAR: ${{ vars.SITE_DEPLOY_TARGET }}
          LOCALE_VAR: ${{ vars.SITE_LOCALE }}
          LOCALES_VAR: ${{ vars.SITE_LOCALES }}
          ANALYTICS_KEY_VAR: ${{ vars.SITE_ANALYTICS_KEY }}
          ANALYTICS_ORIGIN_VAR: ${{ vars.SITE_ANALYTICS_ORIGIN }}
        run: |
          set -euo pipefail
          slug="${SLUG_VAR}"
          domain="${DOMAIN_VAR:-}"
          if [[ -z "$domain" ]]; then
            domain="${slug%-*}.${slug##*-}"
          fi

          # El slug acaba en un path del docroot y en el `find -delete` que lo
          # vacía. El `if:` del job solo garantiza que no esté vacía, no que valga:
          # es una variable de Actions, la escribe la app o una persona. Es una
          # etiqueta única: con una barra o un `..` el borrado saldría del sitio, y
          # con un punto dejaría de casar con *.preview.localhost.
          if ! [[ "$slug" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "SITE_SLUG inválido: '${slug}'" >&2
            exit 1
          fi

          # El dominio también acaba en un path del docroot (producción). Una
          # variable de Actions la escribe una persona o la app, no el repo, así que
          # se comprueba que sea un dominio antes de dejarla entrar en un borrado.
          if ! [[ "$domain" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]]; then
            echo "Dominio inválido: '${domain}'" >&2
            exit 1
          fi

          # Un destino no reconocido tiene que parar el job aquí: si se filtrara
          # hasta los `if:` de abajo no se ejecutaría ningún paso de publicación
          # y el workflow acabaría en verde sin haber publicado nada.
          target="${TARGET_VAR:-docroot}"
          case "$target" in
            docroot|sites) ;;
            *) echo "SITE_DEPLOY_TARGET no reconocido: '${target}'" >&2; exit 1 ;;
          esac

          url="${SITE_URL_VAR:-}"
          if [[ -z "$url" ]]; then
            if [[ "$target" == "docroot" ]]; then
              url="http://${slug}.preview.localhost:8080"
            else
              url="https://${domain}/"
            fi
          fi

          # Los idiomas acaban siendo carpetas de `content/` y segmentos de URL, y
          # como todo lo demás aquí los escribe una variable de Actions: se
          # comprueban antes de dejarlos entrar. Un código inventado no rompería el
          # build, haría algo peor — publicar rutas que no lleva nadie.
          locale="${LOCALE_VAR:-de}"
          if ! [[ "$locale" =~ ^[a-z]{2}$ ]]; then
            echo "SITE_LOCALE inválido: '${locale}'" >&2
            exit 1
          fi

          locales="${LOCALES_VAR:-}"
          if [[ -n "$locales" ]]; then
            IFS=';' read -ra extra <<< "$locales"
            for l in "${extra[@]}"; do
              [[ -z "$l" ]] && continue
              if ! [[ "$l" =~ ^[a-z]{2}$ ]]; then
                echo "SITE_LOCALES contiene un idioma inválido: '${l}'" >&2
                exit 1
              fi
            done
          fi

          # Las dos de analítica van en pareja: el layout del kit no emite la
          # etiqueta sin las dos, y ya no tiene origen por defecto. Una clave sin
          # origen no es "medio configurado", es una configuración rota, y el modo
          # de fallo sería mudo —el sitio se publica, en verde, sin medir, y nadie
          # lo nota hasta que alguien mira el panel de Ñahui y lo ve vacío—. Aquí
          # se para, porque este es el único punto de la cadena que puede: el
          # frontmatter del layout corre una vez por página y no aborta nada.
          #
          # El caso contrario (origen sin clave) NO es un error: es el sitio que no
          # mide a propósito, que es el defecto de la flota.
          if [[ -n "${ANALYTICS_KEY_VAR:-}" && -z "${ANALYTICS_ORIGIN_VAR:-}" ]]; then
            echo "SITE_ANALYTICS_KEY está puesta y SITE_ANALYTICS_ORIGIN no." >&2
            echo "La analítica es opt-in por pareja: sin origen el sitio se publicaría sin medir." >&2
            echo "Escribe SITE_ANALYTICS_ORIGIN en las variables de este repo (no en la organización)." >&2
            exit 1
          fi

          {
            echo "SLUG=${slug}"
            echo "DOMAIN=${domain}"
            echo "DEPLOY_TARGET=${target}"
            echo "SITE_URL=${url}"
            echo "SITE_LOCALE=${locale}"
            echo "SITE_LOCALES=${locales}"
          } >> "$GITHUB_ENV"

          echo "Slug ${slug} · dominio ${domain} · destino ${target} · idioma ${locale}${locales:+ (+${locales})}"
          if [[ -n "${ANALYTICS_KEY_VAR:-}" ]]; then
            echo "Analítica: activa contra ${ANALYTICS_ORIGIN_VAR}"
          else
            echo "Analítica: sin SITE_ANALYTICS_KEY, el sitio se publica sin tracker"
          fi

      # act_runner levanta un contenedor node:24-bookworm nuevo por cada job
      # (docs/bitacora.md, 23 ago 2026): sin esto, cada push reinstala
      # dependencias y reprocesa TODAS las imágenes desde cero, aunque no
      # hayan cambiado. `pnpm store path` necesita pnpm ya activado por
      # corepack, así que va después de "Habilitar pnpm".
      - name: Resolver ruta del store de pnpm
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Aquí el prefijo SÍ es común a todos los repos, al revés que en la caché
      # de abajo: el store de pnpm es direccionable por contenido, así que
      # heredar el de otro sitio es seguro y además acierta casi siempre —los
      # ~100 sitios comparten site-kit y Astro.
      - name: Cachear el store de pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      # Astro ya cachea cada imagen transformada en node_modules/.astro/assets/
      # y la reutiliza si no cambió (astro/dist/assets/build/generate.js, sin
      # flag experimental) — pero esa caché nace y muere con el contenedor si
      # no se persiste aquí. No hay lockfile que invalide "una imagen cambió",
      # así que la clave es única por ejecución y restore-keys trae la más
      # reciente: es una caché acumulativa, no de coincidencia exacta.
      #
      # 🔴 El nombre del repo va DENTRO de la clave: el servidor de caché de
      # act_runner es uno solo para toda la instancia, así que un prefijo sin
      # repo hace que un sitio restaure el node_modules/.astro de otro. Ahí
      # dentro va estado propio del sitio (colecciones de contenido, settings),
      # no solo imágenes.
      - name: Cachear las imágenes ya procesadas por Astro
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-build-cache-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            astro-build-cache-${{ github.repository }}-

      - name: Instalar
        run: pnpm install --frozen-lockfile

      # Falla si content/*.json no cumple schema/*.yaml — la puerta que impide
      # publicar un sitio roto. SITE_URL, SITE_LOCALE y SITE_LOCALES vienen del
      # paso anterior, ya validadas.
      #
      # Las dos PUBLIC_NAHUI_* las lee el layout del kit en su frontmatter con
      # `process.env`. La salida es estática, así que el valor se hornea en el
      # HTML durante el build: no hay capa de ejecución donde inyectarlo después.
      # El prefijo PUBLIC_ no lo exige Astro aquí —sería necesario solo para
      # leerlas desde un <script> de cliente con import.meta.env— pero se
      # mantiene porque dice a las claras que el valor acaba siendo público.
      - name: Build Astro
        env:
          PUBLIC_NAHUI_SITE: ${{ vars.SITE_ANALYTICS_KEY }}
          PUBLIC_NAHUI_ORIGIN: ${{ vars.SITE_ANALYTICS_ORIGIN }}
        run: pnpm build

      - name: Comprobar que hay build
        run: |
          set -euo pipefail
          [[ -d dist ]] || { echo "No existe dist/ tras el build" >&2; exit 1; }

      # Lab: el runner monta el docroot del host en /sites (local-server/runner/config.yaml).
      - name: Publicar en el docroot del lab
        if: env.DEPLOY_TARGET == 'docroot'
        run: |
          set -euo pipefail
          mkdir -p "/sites/${SLUG}"
          # rsync no viene en node:24-bookworm; cp -a basta
          find "/sites/${SLUG}" -mindepth 1 -delete
          cp -a dist/. "/sites/${SLUG}/"
          echo "Publicado → http://${SLUG}.preview.localhost:8080/"

      # Producción: sincroniza dist/ contra /srv/sites/<dominio>/ del servidor que
      # sirve los sitios, por el overlay de WireGuard. El fichero en disco ES la
      # verdad, así que aquí se acaba la publicación: no hay caché que purgar.
      - name: Publicar en el servidor de sitios
        if: env.DEPLOY_TARGET == 'sites'
        env:
          SITES_HOST: ${{ vars.SITES_HOST }}
          SITES_PORT: ${{ vars.SITES_PORT }}
          SITES_DEPLOY_KEY: ${{ secrets.SITES_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          # Sin esto no se puede publicar, y seguir dejaría el job en verde sin
          # haber subido nada: el modo de fallo que este workflow evita en todas
          # partes.
          : "${SITES_DEPLOY_KEY:?falta el secreto de organización SITES_DEPLOY_KEY}"
          : "${SITES_HOST:?falta la variable de organización SITES_HOST}"

          # 🔴 node:24-bookworm trae ssh pero NO rsync — comprobado el 24 ago 2026.
          # Sin esta línea el primer despliegue muere aquí. En el destino sí está.
          if ! command -v rsync >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq rsync >/dev/null
          fi

          # La clave, solo para este job y solo legible por su dueño: ssh se niega
          # a usar una clave privada que pueda leer alguien más.
          clave="$(mktemp)"
          trap 'rm -f "$clave"' EXIT
          printf '%s\n' "$SITES_DEPLOY_KEY" > "$clave"
          chmod 600 "$clave"

          # -o: el destino ignora las opciones del cliente y aplica las suyas
          # (`rrsync -wo`), así que estas son las que el servidor acepta. --mkpath
          # crea la carpeta del sitio en la primera publicación.
          #
          # --delay-updates + --delete-after: los ficheros nuevos se dejan a un
          # lado y se ponen todos de golpe al final, y lo que sobra se borra
          # después. Así un job muerto a medias deja ficheros de más, nunca un
          # 404 — al revés se serviría un sitio a medio borrar.
          rsync -a --delete-after --delay-updates --mkpath \
            -e "ssh -i $clave -p ${SITES_PORT:-22} -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15" \
            dist/ "${SITES_HOST}:${DOMAIN}/"

          echo "Publicado → https://${DOMAIN}/"

      # Los dominios que el cliente compró aparte y que solo llevan al canónico:
      # unos a la portada, otros a una página concreta.
      #
      # 🔑 En el servidor de sitios, un hostname ES una carpeta: existir es todo
      # lo que hace falta para que Caddy le emita el certificado —su endpoint
      # `ask` autoriza justo eso— y lo sirva. Así que dar de alta un dominio de
      # redirección es publicar una carpeta con tres ficheros, sin tocar la
      # configuración del servidor ni recargar nada.
      #
      #   _redirect   la URL destino en texto plano. Es lo que lee Caddy para
      #               devolver un 301 de verdad.
      #   index.html  meta-refresh instantáneo + canonical. Es lo que hace que el
      #               dominio funcione aunque el 301 del borde no esté todavía.
      #   404.html    el mismo contenido, para que CUALQUIER ruta del dominio
      #               extra acabe redirigiendo y no solo «/».
      #
      # No se borra nada al quitar un dominio: la clave de despliegue es de
      # escritura y no sabe qué se quitó. La limpieza es manual, y está en el
      # runbook.
      - name: Publicar los dominios que redirigen
        if: env.DEPLOY_TARGET == 'sites' && vars.SITE_REDIRECTS != ''
        env:
          SITES_HOST: ${{ vars.SITES_HOST }}
          SITES_PORT: ${{ vars.SITES_PORT }}
          SITES_DEPLOY_KEY: ${{ secrets.SITES_DEPLOY_KEY }}
          REDIRECTS: ${{ vars.SITE_REDIRECTS }}
        run: |
          set -euo pipefail

          : "${SITES_DEPLOY_KEY:?falta el secreto de organización SITES_DEPLOY_KEY}"
          : "${SITES_HOST:?falta la variable de organización SITES_HOST}"

          if ! command -v rsync >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq rsync >/dev/null
          fi

          clave="$(mktemp)"
          trap 'rm -f "$clave"' EXIT
          printf '%s\n' "$SITES_DEPLOY_KEY" > "$clave"
          chmod 600 "$clave"

          # Escapa lo que va dentro del HTML. El destino sale de una variable de
          # Actions: la escribe la app, pero esto acaba en una página servida bajo
          # el dominio del cliente y no se mete sin sanear.
          escapar() {
            printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g'
          }

          IFS=';' read -ra entradas <<< "$REDIRECTS"
          for entrada in "${entradas[@]}"; do
            if [[ -z "$entrada" ]]; then continue; fi
            dom="${entrada%%=*}"
            ruta="${entrada#*=}"
            # Una entrada sin `=` deja `ruta` igual a `dom`: es la portada.
            if [[ -z "$ruta" || "$ruta" == "$dom" ]]; then ruta="/"; fi

            # El dominio acaba en un path del docroot, igual que DOMAIN: misma
            # comprobación, por el mismo motivo.
            if ! [[ "$dom" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]]; then
              echo "Dominio de redirección inválido: '${dom}'" >&2
              exit 1
            fi
            # Y la ruta acaba en una cabecera Location: tiene que ser del propio
            # sitio, no otro host.
            if [[ "$ruta" != /* || "$ruta" == //* || "$ruta" == *..* ]]; then
              echo "Ruta de redirección inválida para ${dom}: '${ruta}'" >&2
              exit 1
            fi

            destino="https://${DOMAIN}${ruta}"
            destino_html="$(escapar "$destino")"

            carpeta="$(mktemp -d)"
            # 🔴 `mktemp -d` crea la carpeta con 0700, y `rsync -a` copia el modo
            # del directorio de ORIGEN al de destino. Sin este chmod el dominio
            # acababa en /srv/sites/<dom>/ con 0700 y dueño `sites`, y Caddy —que
            # corre como su propio usuario— no podía ni atravesarlo: el endpoint
            # `ask` respondía 404 (busca <dom>/index.html), Caddy se negaba a
            # emitir el certificado y el dominio moría en el handshake. En el CMS
            # se ve como «issuing certificate · resolves to fetch failed».
            # La carpeta del sitio principal nunca lo sufrió porque su origen es
            # `dist/`, que ya viene 0755 del build. Comprobado el 23 sep 2026.
            chmod 755 "$carpeta"
            printf '%s\n' "$destino" > "${carpeta}/_redirect"

            cat > "${carpeta}/index.html" <<HTML
          <!doctype html>
          <html lang="de">
          <head>
          <meta charset="utf-8">
          <title>${destino_html}</title>
          <meta http-equiv="refresh" content="0; url=${destino_html}">
          <link rel="canonical" href="${destino_html}">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          </head>
          <body>
          <p><a href="${destino_html}">${destino_html}</a></p>
          </body>
          </html>
          HTML
            cp "${carpeta}/index.html" "${carpeta}/404.html"

            rsync -a --delete-after --delay-updates --mkpath \
              -e "ssh -i $clave -p ${SITES_PORT:-22} -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15" \
              "${carpeta}/" "${SITES_HOST}:${dom}/"

            rm -rf "$carpeta"
            echo "Redirección → https://${dom}/ lleva a ${destino}"
          done
