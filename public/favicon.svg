<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 6 36 36" fill="none">
	<circle class="ring" cx="24" cy="24" r="14" stroke-width="2" />
	<circle class="dot" cx="24" cy="24" r="5" />
	<style>
		.ring { fill: none; stroke: #000; }
		.dot { fill: #000; }
		@media (prefers-color-scheme: dark) {
			.ring { stroke: #fff; }
